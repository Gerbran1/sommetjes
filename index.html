      arr[i] = arr[j];

  /* ---------- SVG ---------- */

  /* ---------- audio / speech ---------- */
  function ensureAudio() {
    var Ctx, ctx;
    if (state.audioCtx) {
      ctx = state.audioCtx;
      if (ctx.state === 'suspended' && ctx.resume) {
        try { ctx.resume(); } catch (e1) {}
      }
      return ctx;
    }
    Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    try {
      state.audioCtx = new Ctx();
      return state.audioCtx;
    } catch (e2) {
      return null;
    }
  }

  function playTone(freq, dur, type, gainVal, delay) {
    var ctx, osc, gain, now;
    if (!state.soundOn) return;
    ctx = ensureAudio();
    if (!ctx) return;
    try {
      osc = ctx.createOscillator();
      gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      now = ctx.currentTime + (delay || 0);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(gainVal || 0.12, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + dur + 0.05);
    } catch (e) {}
  }

  function playSuccess() {
    playTone(523.25, 0.13, 'sine', 0.11, 0);
    playTone(659.25, 0.13, 'sine', 0.11, 0.1);
    playTone(783.99, 0.28, 'sine', 0.13, 0.2);
  }

  function playWrong() {
    playTone(262, 0.16, 'sine', 0.06, 0);
    playTone(220, 0.2, 'sine', 0.05, 0.08);
  }

  function playReward() {
    playTone(523, 0.18, 'sine', 0.11, 0);
    playTone(659, 0.18, 'sine', 0.11, 0.12);
    playTone(784, 0.18, 'sine', 0.11, 0.24);
    playTone(1046, 0.32, 'sine', 0.13, 0.36);
  }

  var voiceAudio = null;
  var audioUnlocked = false;
  var lastClipKey = '';
  var lastClipAt = 0;

  function ensureVoiceAudio() {
    if (!voiceAudio) {
      voiceAudio = new Audio();
      try { voiceAudio.setAttribute('preload', 'auto'); } catch (e1) {}
      try { voiceAudio.setAttribute('playsinline', 'playsinline'); } catch (e2) {}
    }
    return voiceAudio;
  }

  function unlockAudio() {
    var a;
    if (audioUnlocked) return;
    a = ensureVoiceAudio();
    try {
      a.src = 'audio/silence.mp3';
      a.play();
      a.pause();
      if (a.currentTime) a.currentTime = 0;
    } catch (e) {}
    audioUnlocked = true;
  }

  function stopSpeak() {
    if (!voiceAudio) return;
    try {
      voiceAudio.pause();
      if (voiceAudio.currentTime) voiceAudio.currentTime = 0;
    } catch (e) {}
  }

  function beginQuestionVoice() {
    state.voiceName = (state.voiceName === 'colette') ? 'maarten' : 'colette';
    return state.voiceName;
  }

  function resetVoiceCycle() {
    state.voiceName = null;
  }

  function speak(id, _rate) {
    var a, src, now, key, voice;
    if (!state.soundOn) return;
    if (!id) return;
    voice = state.voiceName || 'colette';
    now = new Date().getTime();
    key = voice + '/' + id;
    if (key === lastClipKey && now - lastClipAt < 1000) return;
    lastClipKey = key;
    lastClipAt = now;
    stopSpeak();
    a = ensureVoiceAudio();
    src = 'audio/' + voice + '/' + id + '.mp3';
    a.onerror = function () {
      try { a.pause(); } catch (e2) {}
    };
    try {
      a.src = src;
      a.play();
    } catch (e) {}
  }

  /* ---------- questions ---------- */
  function makeChoices(correct, minN, maxN) {
    var set = [correct];
    var guard = 0;
    var n, extra, down, up;
    while (set.length < 3 && guard < 40) {
      guard += 1;
      n = randInt(minN, maxN);
      if (!contains(set, n)) set.push(n);
    }
    extra = 0;
    while (set.length < 3) {
      extra += 1;
      down = correct - extra;
      up = correct + extra;
      if (down >= 0 && !contains(set, down)) set.push(down);
      if (set.length < 3 && !contains(set, up)) set.push(up);
    }
    return shuffle(set);
  }

  function makeCountQ() {
    var n, tries, kind, q;
    tries = 0;
    do {
      n = randInt(1, 10);
      tries += 1;
    } while (n === state.lastAnswer && tries < 8);
    kind = pick(KINDS);
    q = {
      mode: 'count',
      kind: kind,
      answer: n,
      prompt: 'Hoeveel?',
      speech: 'count',
      choices: makeChoices(n, 1, 10)
    };
    return q;
  }

  function makePlusQ(maxSum) {
    var a, b, sum, tries, kind, minSum, q;
    tries = 0;
    minSum = (maxSum <= 5) ? 2 : 5;
    do {
      sum = randInt(minSum, maxSum);
      a = randInt(1, sum - 1);
      b = sum - a;
      tries += 1;
    } while (sum === state.lastAnswer && tries < 8);
    kind = pick(KINDS);
    q = {
      mode: 'plus',
      kind: kind,
      a: a,
      b: b,
      answer: sum,
      prompt: a + ' + ' + b + ' = ?',
      speech: 'plus-' + a + '-' + b,
      choices: makeChoices(sum, 1, maxSum)
    };
    return q;
  }

  function makeMinusQ(maxN) {
    var total, take, left, tries, kind, q;
    tries = 0;
    do {
      total = randInt(2, maxN);
      take = (total <= 2) ? 1 : randInt(1, total - 1);
      left = total - take;
      tries += 1;
    } while (left === state.lastAnswer && tries < 8);
    kind = pick(KINDS);
    q = {
      mode: 'minus',
      kind: kind,
      total: total,
      take: take,
      answer: left,
      prompt: total + ' − ' + take + ' = ?',
      speech: 'minus-' + total + '-' + take,
      choices: makeChoices(left, 0, maxN)
    };
    return q;
  }

  function dutchNum(n) {
    var words = ['nul', 'één', 'twee', 'drie', 'vier', 'vijf', 'zes', 'zeven', 'acht', 'negen', 'tien'];
    if (n >= 0 && n <= 10) return words[n];
    return String(n);
  }

  function makeTableChoices(a, b) {
    var correct, raw, others, choices, i, n, extra, down, up;
    correct = a * b;
    raw = [
      a * (b + 1),
      a * (b - 1),
      (a + 1) * b,
      (a - 1) * b,
      correct + a,
      correct - a,
      correct + b,
      correct - b,
      a + b,
      a * a,
      b * b,
      correct + 1,
      correct - 1,
      (a + 1) * (b + 1)
    ];
    others = [];
    for (i = 0; i < raw.length; i++) {
      n = raw[i];
      if (n >= 1 && n <= 120 && n !== correct && !contains(others, n)) {
        others.push(n);
      }
    }
    shuffle(others);
    choices = [correct];
    if (others.length > 0) choices.push(others[0]);
    if (others.length > 1) choices.push(others[1]);
    extra = 1;
    while (choices.length < 3) {
      down = correct - extra;
      up = correct + extra;
      if (down >= 1 && !contains(choices, down)) choices.push(down);
      if (choices.length < 3 && !contains(choices, up)) choices.push(up);
      extra += 1;
    }
    return shuffle(choices);
  }

  function makeTableQ() {
    var a, b, product, tries, q;
    tries = 0;
    do {
      if (state.tableN === 0) {
        a = randInt(1, 10);
        b = randInt(1, 10);
      } else {
        a = state.tableN;
        b = randInt(1, 10);
      }
      product = a * b;
      tries += 1;
    } while (a === state.lastA && b === state.lastB && tries < 8);
    q = {
      mode: 'tables',
      a: a,
      b: b,
      answer: product,
      prompt: a + ' × ' + b + ' = ?',
      speech: 'keer-' + a + '-' + b,
      choices: makeTableChoices(a, b),
      showVisual: product <= 30
    };
    return q;
  }

  function visualTableHtml(rows, cols) {
    var r, c, html, sizeCls, n;
    n = rows * cols;
    sizeCls = (n >= 20) ? 'dots-sm' : (n >= 12 ? 'dots-md' : 'dots-lg');
    html = '<div class="tray vis-table ' + sizeCls + '">';
    for (r = 0; r < rows; r++) {
      html += '<div class="trow">';
      for (c = 0; c < cols; c++) {
        html += '<span class="tdot"></span>';
      }
      html += '</div>';
    }

  function makeZoekQ() {

  }

  function makeBegintQ() {

    state.lastWord = w.word;
    return {
      mode: 'begint',
      answer: w.letter,
      prompt: '',
      speech: 'begint-' + w.word,
      choices: makeLetterChoices(w.letter),
      word: w

  /* canvas tracing */
  function bindTraceCanvas() {
    var c = $('trace-canvas');
    if (!c || traceState.bound) return;
    traceState.bound = true;
    c.addEventListener('touchstart', onTraceStart, false);
    c.addEventListener('touchmove', onTraceMove, false);
    c.addEventListener('touchend', onTraceEnd, false);
    c.addEventListener('touchcancel', onTraceEnd, false);
    c.addEventListener('mousedown', onTraceStart, false);
    document.addEventListener('mousemove', onTraceMove, false);
    document.addEventListener('mouseup', onTraceEnd, false);
  }

  function eventPoint(e, canvas) {
    var rect, src, x, y, w, h;
    rect = canvas.getBoundingClientRect();
    if (e.touches && e.touches.length) src = e.touches[0];
    else if (e.changedTouches && e.changedTouches.length) src = e.changedTouches[0];
    else src = e;
    w = rect.width || 1;
    h = rect.height || 1;
    x = src.clientX - rect.left;
    y = src.clientY - rect.top;
    return { x: x * (canvas.width / w), y: y * (canvas.height / h) };
  }

  function sampleLetterPoints(letter, width, height) {
    var c, ctx, data, points, x, y, i, step, size;
    c = document.createElement('canvas');
    c.width = width;
    c.height = height;
    ctx = c.getContext('2d');
    size = Math.floor(Math.min(width, height) * 0.72);
    ctx.fillStyle = '#000';
    ctx.font = 'bold ' + size + 'px "Helvetica Neue", Helvetica, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(letter, width / 2, height / 2 + size * 0.04);
    data = ctx.getImageData(0, 0, width, height).data;
    points = [];
    step = Math.max(8, Math.round(Math.min(width, height) / 36));
    for (y = 0; y < height; y += step) {
      for (x = 0; x < width; x += step) {
        i = (y * width + x) * 4;
        if (data[i + 3] > 90) points.push({ x: x, y: y });
      }
    }
    return points;
  }

  function startTraceLetter() {
    var ch, tries, canvas, prompt;
    tries = 0;
    do {
      ch = LETTER_SET[randInt(0, LETTER_SET.length - 1)];
      tries += 1;
    } while (ch === state.lastLetter && tries < 8);
    state.lastLetter = ch;
    state.currentSpeech = 'overtrek-' + ch;
    traceState.letter = ch;
    traceState.strokes = [];
    traceState.current = null;
    traceState.drawing = false;
    traceState.done = false;
    state.locked = false;
    prompt = $('trace-prompt');
    if (prompt) prompt.innerHTML = ch;
    bindTraceCanvas();
    sizeAndDrawTrace();
    beginQuestionVoice();
    speak(state.currentSpeech);
  }

  function sizeAndDrawTrace() {
    var canvas, wrap, w, h;
    canvas = $('trace-canvas');
    wrap = $('trace-wrap');
    if (!canvas || !wrap) return;
    w = wrap.clientWidth;
    h = wrap.clientHeight;
    if (w < 60) w = 620;
    if (h < 60) h = 340;
    canvas.width = w;
    canvas.height = h;
    traceState.guide = sampleLetterPoints(traceState.letter, w, h);
    drawTrace();
  }

  function drawTrace() {
    var canvas, ctx, i, j, s, p, size, w, h;
    canvas = $('trace-canvas');
    if (!canvas) return;
    ctx = canvas.getContext('2d');
    w = canvas.width;
    h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    size = Math.floor(Math.min(w, h) * 0.72);
    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = '#1A4A6A';
    ctx.font = 'bold ' + size + 'px "Helvetica Neue", Helvetica, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(traceState.letter, w / 2, h / 2 + size * 0.04);
    ctx.restore();
    ctx.fillStyle = '#F9A825';
    for (i = 0; i < traceState.guide.length; i++) {
      p = traceState.guide[i];
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(3, Math.round(Math.min(w, h) * 0.012)), 0, Math.PI * 2, false);
      ctx.fill();
    }
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#2EC4B6';
    ctx.lineWidth = Math.max(16, Math.round(Math.min(w, h) * 0.055));
    for (i = 0; i < traceState.strokes.length; i++) {
      s = traceState.strokes[i];
      if (!s.length) continue;
      ctx.beginPath();
      ctx.moveTo(s[0].x, s[0].y);
      for (j = 1; j < s.length; j++) ctx.lineTo(s[j].x, s[j].y);
      ctx.stroke();
    }
    if (traceState.current && traceState.current.length) {
      s = traceState.current;
      ctx.beginPath();
      ctx.moveTo(s[0].x, s[0].y);
      for (j = 1; j < s.length; j++) ctx.lineTo(s[j].x, s[j].y);
      ctx.stroke();
    }
  }

  function onTraceStart(e) {
    var canvas, p;
    if (state.screen !== 'trace' || traceState.done || state.locked) return;
    canvas = $('trace-canvas');
    if (!canvas) return;
    if (e.target && e.target !== canvas && e.type.indexOf('mouse') === 0) return;
    if (e.preventDefault) e.preventDefault();
    p = eventPoint(e, canvas);
    traceState.drawing = true;
    traceState.current = [p];
    drawTrace();
  }

  function onTraceMove(e) {
    var canvas, p, last, dx, dy;
    if (!traceState.drawing || state.screen !== 'trace') return;
    canvas = $('trace-canvas');
    if (!canvas) return;
    if (e.preventDefault) e.preventDefault();
    p = eventPoint(e, canvas);
    last = traceState.current[traceState.current.length - 1];
    if (last) {
      dx = p.x - last.x;
      dy = p.y - last.y;
      if (dx * dx + dy * dy < 9) return;
    }
    traceState.current.push(p);
    drawTrace();
  }

  function onTraceEnd(e) {
    if (!traceState.drawing) return;
    if (e && e.preventDefault) e.preventDefault();
    traceState.drawing = false;
    if (traceState.current && traceState.current.length) {
      traceState.strokes.push(traceState.current);
    }
    traceState.current = null;
    drawTrace();
    if (traceCoverage() >= 0.7) {
      finishTrace();
    }
  }

  function allStrokePoints() {
    var out, i, j, s;
    out = [];
    for (i = 0; i < traceState.strokes.length; i++) {
      s = traceState.strokes[i];
      for (j = 0; j < s.length; j++) out.push(s[j]);
    }
    if (traceState.current) {
      for (j = 0; j < traceState.current.length; j++) out.push(traceState.current[j]);
    }
    return out;
  }

  function traceCoverage() {
    var ink, pts, i, j, p, q, dx, dy, rad, rad2, hit, covered, canvas;
    canvas = $('trace-canvas');
    ink = traceState.guide;
    if (!ink.length) return 0;
    pts = allStrokePoints();
    if (!pts.length) return 0;
    rad = canvas ? Math.max(26, Math.round(Math.min(canvas.width, canvas.height) * 0.07)) : 30;
    rad2 = rad * rad;
    covered = 0;
    for (i = 0; i < ink.length; i++) {
      p = ink[i];
      hit = false;
      for (j = 0; j < pts.length; j++) {
        q = pts[j];
        dx = p.x - q.x;
        dy = p.y - q.y;
        if (dx * dx + dy * dy <= rad2) {
          hit = true;
          break;
        }
      }
      if (hit) covered += 1;
    }
    return covered / ink.length;
  }

  function finishTrace() {
    if (traceState.done || state.locked) return;
    traceState.done = true;
    awardCorrect();
  }

  function clearTrace() {
    if (state.locked) return;

  function nameCharsOf(name) {
    var out, i;
    out = [];
    for (i = 0; i < name.length; i++) {
      out.push(i === 0 ? name.charAt(i) : name.charAt(i).toLowerCase());
    }
    return out;
  }

  function startName(name) {
    var chars, tiles, used, pool, i, ch, lower, extra;
    chars = nameCharsOf(name);
    used = {};
    for (i = 0; i < chars.length; i++) used[chars[i].toLowerCase()] = true;
    tiles = chars.slice(0);
    pool = LETTER_SET.concat(['e', 'l', 'u', 't', 'h', 'o', 'd', 'b']);
    extra = 0;
    for (i = 0; i < pool.length && extra < 2; i++) {
      ch = pool[i];
      lower = ch.toLowerCase();
      if (!used[lower]) {
        tiles.push(ch);
        used[lower] = true;
        extra += 1;
      }
    }
    shuffle(tiles);
    state.childName = name;
    state.nameChars = chars;
    state.nameIndex = 0;
    state.nameTiles = tiles;
    state.locked = false;
    showScreen('nameplay');
    renderNamePlay();
    beginQuestionVoice();
    speak('name-' + name.toLowerCase());
  }

  function renderNamePlay() {
    var boxes, tiles, html, i, ch, filled, cls, child, color;
    boxes = $('name-boxes');
    tiles = $('name-tiles');
    child = null;
    for (i = 0; i < CHILDREN.length; i++) {
      if (CHILDREN[i].name === state.childName) child = CHILDREN[i];
    }
    color = child ? child.color : '#8B7CFF';
    html = '';
    for (i = 0; i < state.nameChars.length; i++) {
      filled = i < state.nameIndex;
      ch = state.nameChars[i];
      cls = 'name-box' + (filled ? ' filled' : ' empty');
      html += '<div class="' + cls + '"' + (filled ? ' style="border-color:' + color + ';"' : '') + '>' +
        (filled ? ch : '') + '</div>';
    }
    boxes.innerHTML = html;
    html = '';
    for (i = 0; i < state.nameTiles.length; i++) {
      ch = state.nameTiles[i];
      if (ch === '') {
        html += '<button type="button" class="name-tile used" disabled="disabled"></button>';
      } else {
        html += '<button type="button" class="tap name-tile" data-act="name-tile" data-ch="' + ch + '" data-idx="' + i + '">' + ch + '</button>';
      }
    }
    tiles.innerHTML = html;
    updateStarsUI();
  }

  function onNameTile(el) {

    ch = el.getAttribute('data-ch');
    need = state.nameChars[state.nameIndex];
    idx = parseInt(el.getAttribute('data-idx'), 10);

  function shufflePuzzle(n) {
    var arr = [], i, j, t, total;
    total = n * n;
    for (i = 0; i < total; i++) arr.push(i);
    do {
      for (i = total - 1; i > 0; i--) {
        j = Math.floor(Math.random() * (i + 1));
        t = arr[i];
        arr[i] = arr[j];
        arr[j] = t;
      }
    } while (puzzleSolved(arr));
    return arr;
  }

  function puzzleSolved(arr) {
    var i;
    if (!arr) return false;
    for (i = 0; i < arr.length; i++) {
      if (arr[i] !== i) return false;
    }
    return true;
  }

  function fillOval(ctx, x, y, rx, ry, color) {
    ctx.save();

    ctx.arc(0, 0, 20, 0, Math.PI * 2, false);
    ctx.fill();
    ctx.restore();
  }

    ctx.strokeStyle = '#FFD54F';
    ctx.lineWidth = Math.max(3, r / 8);
    ctx.lineCap = 'round';
    for (i = 0; i < 8; i++) {
      a = i * Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r * 1.25, cy + Math.sin(a) * r * 1.25);
      ctx.lineTo(cx + Math.cos(a) * r * 1.7, cy + Math.sin(a) * r * 1.7);
      ctx.stroke();
    }
  }

  function layoutAndDrawPuzzle() {
    var wrap, board, n, availW, availH, boardSize, tile, gap, i, piece, btn, cv, srcSize, sx, sy, sw, kind, prevCv, ctx;
    n = state.puzzleN;
    if (!n || !state.puzzleOrder) return;
    wrap = $('puzzle-wrap');
    board = $('puzzle-board');
    if (!wrap || !board) return;
    srcSize = 480;
    kind = PUZZLE_PICS[state.puzzlePic] || PUZZLE_PICS[0];
    puzzleSrc = makePuzzleSource(kind, srcSize);
    prevCv = $('puzzle-preview-cv');
    if (prevCv) {
      prevCv.width = 180;
      prevCv.height = 180;
      ctx = prevCv.getContext('2d');
      ctx.clearRect(0, 0, 180, 180);
      ctx.drawImage(puzzleSrc, 0, 0, 180, 180);
    }
    availW = wrap.clientWidth || 700;
    availH = wrap.clientHeight || 0;
    if (availH < 80) {
      availH = (window.innerHeight || 700) - 200;
    }
    availH = availH - 110;
    if (availW < 50) availW = 700;
    if (availH < 160) availH = 160;
    gap = 6;
    boardSize = Math.min(availW - 16, availH);
    tile = Math.floor((boardSize - gap * (n - 1)) / n);
    if (tile < 48) tile = 48;
    boardSize = tile * n + gap * (n - 1);
    board.style.width = boardSize + 'px';
    board.style.height = boardSize + 'px';
    board.innerHTML = '';
    sw = Math.floor(srcSize / n);
    for (i = 0; i < n * n; i++) {
      piece = state.puzzleOrder[i];
      btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tap puzzle-tile' + (puzzleSel === i ? ' selected' : '');
      btn.setAttribute('data-act', 'puzzle-tile');
      btn.setAttribute('data-slot', String(i));
      btn.style.position = 'absolute';
      btn.style.width = tile + 'px';
      btn.style.height = tile + 'px';
      btn.style.left = ((i % n) * (tile + gap)) + 'px';
      btn.style.top = (Math.floor(i / n) * (tile + gap)) + 'px';
      cv = document.createElement('canvas');
      sx = (piece % n) * sw;
      sy = Math.floor(piece / n) * sw;
      cv.width = sw;
      cv.height = sw;
      cv.getContext('2d').drawImage(puzzleSrc, sx, sy, sw, sw, 0, 0, sw, sw);
      btn.appendChild(cv);
      board.appendChild(btn);
    }
  }

  function onPuzzleTile(el) {
    var slot, tmp;
    if (state.locked) return;
    slot = parseInt(el.getAttribute('data-slot'), 10);
    if (isNaN(slot)) return;
    if (puzzleSel < 0) {
      puzzleSel = slot;
      highlightPuzzleSel();
      return;
    }
    if (puzzleSel === slot) {
      puzzleSel = -1;
      highlightPuzzleSel();
      return;
    }
    tmp = state.puzzleOrder[puzzleSel];
    state.puzzleOrder[puzzleSel] = state.puzzleOrder[slot];
    state.puzzleOrder[slot] = tmp;
    puzzleSel = -1;
    layoutAndDrawPuzzle();
    if (puzzleSolved(state.puzzleOrder)) {
      awardCorrect();
    }
  }

  function highlightPuzzleSel() {
    var tiles, i, slot, cls;
    tiles = document.getElementsByClassName('puzzle-tile');
    for (i = 0; i < tiles.length; i++) {
      slot = parseInt(tiles[i].getAttribute('data-slot'), 10);
      cls = 'tap puzzle-tile';
      if (puzzleSel === slot) cls += ' selected';
      tiles[i].className = cls;
    }
  }

  function goHome() {
    state.level = null;
    state.letterMode = null;
    state.locked = false;
    state.question = null;
    hideReward();
    showScreen('start');
    updateStarsUI();
  }

  function showGamesMenu() {
    state.level = null;
    state.locked = false;
    state.question = null;
    hideReward();
    showScreen('home');
    updateStarsUI();
  }

  function showPicker() {
    state.level = 'tables';
    state.locked = false;
    state.question = null;
    hideReward();
    showScreen('picker');
    updateStarsUI();
  }

  function startLevel(level) {
    state.level = level;
    state.sessionCorrect = 0;
    state.towardsReward = 0;
    state.locked = false;
    state.lastAnswer = -1;
    state.lastA = -1;
    state.lastB = -1;
    state.minusHard = false;
    state.lastWasPersonal = false;
    resetVoiceCycle();
    hideRepeatBtn();
    showScreen('play');
    nextQuestion();
  }

  function onAnswer(btn) {
    var val, correct, praiseA;
    if (state.locked) return;
    if (!state.question) return;
    val = btn.getAttribute('data-value');
    correct = String(state.question.answer);
    if (String(val) === correct) {
      state.locked = true;
      state.stars += 1;
      state.sessionCorrect += 1;
      state.towardsReward += 1;
      state.lastAnswer = correct;
      saveStars();
      btn.className = 'tap answer-btn is-correct';
      playSuccess();
      showBurst();
      praiseA = choosePraise();
      showToast(praiseA.text, true);
      speak(praiseA.id);
      updateStarsUI();
      window.setTimeout(function () {
        if (state.towardsReward >= 5) {
          showReward();
        } else {
          nextQuestion();
        }
      }, 1100);
    } else {
      playWrong();
      btn.className = 'tap answer-btn is-wrong shake';
      showToast('Probeer nog eens', false);
      speak('retry');
      window.setTimeout(function () {
        if (btn && btn.className.indexOf('is-correct') === -1) {
          btn.className = 'tap answer-btn is-wrong';
        }
      }, 450);
    }
  }

  function toggleSound() {
    state.soundOn = !state.soundOn;
    saveSound();
    updateSoundIcons();
    if (state.soundOn) {
      ensureAudio();
      unlockAudio();
      playSuccess();
    } else {
      stopSpeak();
    }
  }

  /* ---------- tap handling (iOS 9, no 300ms delay) ---------- */
  function findClickable(el) {
    while (el && el !== document.body && el !== document.documentElement) {
      if (el.getAttribute && el.getAttribute('data-act') &&
          el.className && (' ' + el.className + ' ').indexOf(' tap ') !== -1) {
        return el;
      }
      el = el.parentNode;
    }
    return null;
  }

  function clearPressed() {
    if (pressEl) {
      pressEl.className = pressEl.className.replace(/\s?pressed/g, '');
      pressEl = null;
    }
  }

  function setPressed(el) {
    clearPressed();
    if (!el) return;
    pressEl = el;
    if ((' ' + el.className + ' ').indexOf(' pressed ') === -1) {
      el.className = el.className + ' pressed';
    }
  }

  function handleAct(el) {
    var act, level, t;
    act = el.getAttribute('data-act');
    if (act === 'sound') {
      toggleSound();
      return;
    }
    if (act === 'home') {
      if (state.screen === 'play' && state.level === 'tables') {
        showPicker();
      } else if (state.screen === 'play' && state.level === 'letters') {
        showLettersMenu();
      } else if (state.screen === 'trace') {
        showLettersMenu();
      } else if (state.screen === 'nameplay' || state.screen === 'names') {
        showLettersMenu();
      } else if (state.screen === 'letters') {
        goHome();
      } else if (state.screen === 'puzzle') {
        showPuzzleLevel();
      } else if (state.screen === 'puzzlelevel') {
        showPuzzlesMenu();
      } else if (state.screen === 'puzzles') {
        goHome();
      } else if (state.screen === 'play' || state.screen === 'picker' || state.screen === 'home') {
        showGamesMenu();
      } else {
        goHome();
      }
      return;
    }
    if (act === 'goto-games') {
      showGamesMenu();
      return;
    }
    if (act === 'goto-letters') {
      showLettersMenu();
      return;
    }
    if (act === 'goto-puzzles') {
      showPuzzlesMenu();
      return;
    }
    if (act === 'pick-player') {
      setPlayer(el.getAttribute('data-name'));
      speak('name-' + String(el.getAttribute('data-name') || '').toLowerCase());
      return;
    }
    if (act === 'puzzle-game') {
      showPuzzleLevel();
      return;
    }
    if (act === 'puzzle-size') {
      startPuzzle(parseInt(el.getAttribute('data-size'), 10), true);
      return;
    }
    if (act === 'puzzle-tile') {
      onPuzzleTile(el);
      return;
    }
    if (act === 'verder') {
      hideReward();
      state.towardsReward = 0;
      updateStarsUI();
      nextQuestion();
      return;
    }
    if (act === 'level') {
      level = el.getAttribute('data-level');
      if (level === 'tables') {
        showPicker();
        return;
      }
      if (level === 'letters') {
        showLettersMenu();
        return;
      }
      if (level) startLevel(level);
      return;
    }
    if (act === 'table') {
      t = parseInt(el.getAttribute('data-table'), 10);
      if (isNaN(t)) return;
      state.tableN = t;
      startLevel('tables');
      return;
    }
    if (act === 'letter-mode') {
      startLetterMode(el.getAttribute('data-mode'));
      return;
    }
    if (act === 'repeat') {
      if (state.currentSpeech) speak(state.currentSpeech, 0.8);
      return;
    }
    if (act === 'trace-clear') {
      clearTrace();
      return;
    }
    if (act === 'pick-name') {
      startName(el.getAttribute('data-name'));
      return;
    }
    if (act === 'name-tile') {
      onNameTile(el);
      return;
    }
    if (act === 'answer') {
      onAnswer(el);
    }
  }

  function onTouchStart(e) {
    var t, el;
    unlockAudio();
    if (!e.touches || e.touches.length !== 1) return;
    t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    touchStartTime = new Date().getTime();
    touchMoved = false;
    el = findClickable(e.target);
    if (el) setPressed(el);
  }

  function onTouchMove(e) {
    var t;
    if (!e.touches || e.touches.length < 1) return;
    t = e.touches[0];
    if (Math.abs(t.clientX - touchStartX) > 16 || Math.abs(t.clientY - touchStartY) > 16) {
      touchMoved = true;
      clearPressed();
    }
    e.preventDefault();
  }

  function onTouchEnd(e) {
    var el, now;
    now = new Date().getTime();
    lastTouchEnd = now;
    el = findClickable(e.target);
    clearPressed();
    if (!touchMoved && el && (now - touchStartTime) < 700) {
      e.preventDefault();
      handleAct(el);
    }
  }

  function onTouchCancel() {
    touchMoved = true;
    clearPressed();
  }

  function onClick(e) {
    var el, now;
    unlockAudio();
    now = new Date().getTime();
    if (now - lastTouchEnd < 600) {
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    el = findClickable(e.target);
    if (el) {
      handleAct(el);
    }
  }

  function onGestureStart(e) {
    e.preventDefault();
  }

  function decorateStatic() {
    $('sun-icon').innerHTML = sunHtml();
    elSet('start-star-icon', starSvg('#FFD54F', '#F9A825'));
    elSet('games-star-icon', starSvg('#FFD54F', '#F9A825'));
    $('play-star-icon').innerHTML = starSvg('#FFD54F', '#F9A825');
    $('picker-star-icon').innerHTML = starSvg('#FFD54F', '#F9A825');
    $('home-icon').innerHTML = homeIconHtml();
    elSet('games-home-icon', homeIconHtml());
    $('picker-home-icon').innerHTML = homeIconHtml();
    elSet('letters-home-icon', homeIconHtml());
    elSet('trace-home-icon', homeIconHtml());
    elSet('names-home-icon', homeIconHtml());
    elSet('nameplay-home-icon', homeIconHtml());
    elSet('puzzles-home-icon', homeIconHtml());
    elSet('puzzlelevel-home-icon', homeIconHtml());
    elSet('puzzle-home-icon', homeIconHtml());
    elSet('letters-star-icon', starSvg('#FFD54F', '#F9A825'));
    elSet('trace-star-icon', starSvg('#FFD54F', '#F9A825'));
    elSet('names-star-icon', starSvg('#FFD54F', '#F9A825'));
    elSet('nameplay-star-icon', starSvg('#FFD54F', '#F9A825'));
    elSet('puzzles-star-icon', starSvg('#FFD54F', '#F9A825'));
    elSet('puzzlelevel-star-icon', starSvg('#FFD54F', '#F9A825'));
    elSet('puzzle-star-icon', starSvg('#FFD54F', '#F9A825'));
    $('icon-count').innerHTML =
      '<span class="mini">' + appleSvg() + '</span>' +
      '<span class="mini">' + appleSvg() + '</span>' +
      '<span class="mini">' + appleSvg() + '</span>';
    $('icon-plus5').innerHTML =
      '<span class="mini">' + flowerSvg() + '</span>' +
      plusSignHtml().replace('op-sign', 'op-sign').replace('70px', '40px') +
      '<span class="mini">' + flowerSvg() + '</span>';
    $('icon-plus10').innerHTML =
      '<span class="mini">' + ballSvg() + '</span>' +
      plusSignHtml() +
      '<span class="mini">' + ballSvg() + '</span>';
    $('icon-minus').innerHTML =
      '<span class="mini">' + objectHtml('apple', false).replace('class="obj"', 'class="obj" style="width:44px;height:44px;margin:0 2px;"') + '</span>' +
      '<span class="mini">' + objectHtml('apple', true).replace('class="obj obj-gone"', 'class="obj obj-gone" style="width:44px;height:44px;margin:0 2px;"') + '</span>';
    $('icon-tables').innerHTML =
      '<div class="tbl-icon">' +
      '<div class="trow"><span class="tdot"></span><span class="tdot"></span><span class="tdot"></span></div>' +
      '<div class="trow"><span class="tdot"></span><span class="tdot"></span><span class="tdot"></span></div>' +
      '<div class="trow"><span class="tdot"></span><span class="tdot"></span><span class="tdot"></span></div>' +
      '</div>';
    if ($('icon-begint')) $('icon-begint').innerHTML = '<span class="mini-pic">' + wordSvg('maan') + '</span>';
    if ($('icon-trace-act')) $('icon-trace-act').innerHTML = '<span style="font-size:44px;letter-spacing:2px;border-bottom:3px dotted #6A3E00;">a</span>';

    if (window.navigator && window.navigator.standalone) {
      document.body.className = 'standalone';
      $('home-hint').innerHTML = '';
    } else {
      $('home-hint').innerHTML = 'Zet op beginscherm: Delen \u2192 Zet op beginscherm';
    }
  }

  function ready() {
    loadState();
    decorateStatic();
    updatePlayerUI();
    updateStarsUI();
    showScreen('start');

    document.addEventListener('touchstart', onTouchStart, false);
    document.addEventListener('touchmove', onTouchMove, false);
    document.addEventListener('touchend', onTouchEnd, false);
    document.addEventListener('touchcancel', onTouchCancel, false);
    document.addEventListener('click', onClick, false);
    document.addEventListener('gesturestart', onGestureStart, false);

    window.addEventListener('orientationchange', function () {
      window.scrollTo(0, 0);
      window.setTimeout(function () {
        window.scrollTo(0, 0);
        if (state.screen === 'trace') sizeAndDrawTrace();
        if (state.screen === 'puzzle') layoutAndDrawPuzzle();
      }, 250);
    }, false);

    document.addEventListener('touchstart', function () {
      ensureAudio();
      unlockAudio();
    }, false);
  }

  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    ready();
  } else {
    document.addEventListener('DOMContentLoaded', ready, false);
  }
})();
  </script>
