  <script>
(function () {
  'use strict';

  var KINDS = ['apple', 'star', 'ball', 'flower', 'balloon', 'pear'];
  var PRAISE = ['Goed zo!', 'Super!', 'Wat knap!', 'Prima!', 'Ja!', 'Goed gedaan!'];
  var REWARD = ['Wat knap!', 'Super gedaan!', 'Vijf sterren!', 'Goed zo!'];

  var state = {
    screen: 'home',
    level: null,
    stars: 0,
    sessionCorrect: 0,
    locked: false,
    question: null,
    lastAnswer: -1,
    soundOn: true,
    audioCtx: null,
    minusHard: false,
    towardsReward: 0,
    tableN: 0,
    lastA: -1,
    lastB: -1
  };

  var toastTimer = null;
  var burstTimer = null;
  var lastTouchEnd = 0;
  var touchStartX = 0;
  var touchStartY = 0;
  var touchStartTime = 0;
  var touchMoved = false;
  var pressEl = null;

  function $(id) {
    return document.getElementById(id);
  }

  function randInt(min, max) {
    return min + Math.floor(Math.random() * (max - min + 1));
  }

  function contains(arr, val) {
    var i;
    for (i = 0; i < arr.length; i++) {
      if (arr[i] === val) return true;
    }
    return false;
  }

  function shuffle(arr) {
    var i, j, t;
    for (i = arr.length - 1; i > 0; i--) {
      j = Math.floor(Math.random() * (i + 1));
      t = arr[i];
      arr[i] = arr[j];
      arr[j] = t;
    }
    return arr;
  }

  function pick(arr) {
    return arr[randInt(0, arr.length - 1)];
  }

  function loadState() {
    try {
      var s = window.localStorage.getItem('sommetjes-stars');
      if (s) {
        var n = parseInt(s, 10);
        if (!isNaN(n) && n >= 0) state.stars = n;
      }
      var so = window.localStorage.getItem('sommetjes-sound');
      if (so === '0') state.soundOn = false;
    } catch (e) {}
  }

  function saveStars() {
    try {
      window.localStorage.setItem('sommetjes-stars', String(state.stars));
    } catch (e) {}
  }

  function saveSound() {
    try {
      window.localStorage.setItem('sommetjes-sound', state.soundOn ? '1' : '0');
    } catch (e) {}
  }

  /* ---------- SVG ---------- */
  function starSvg(color, stroke) {
    color = color || '#FFD54F';
    stroke = stroke || '#F9A825';
    return '<svg viewBox="0 0 100 100" class="obj-svg" focusable="false">' +
      '<polygon points="50,6 61,36 93,38 68,58 76,92 50,74 24,92 32,58 7,38 39,36" fill="' + color + '" stroke="' + stroke + '" stroke-width="3" stroke-linejoin="round"/>' +
      '</svg>';
  }

  function appleSvg() {
    return '<svg viewBox="0 0 100 100" class="obj-svg" focusable="false">' +

      '<ellipse cx="64" cy="22" rx="14" ry="7" fill="#43A047" transform="rotate(28 64 22)"/>' +
      '<ellipse cx="38" cy="58" rx="25" ry="30" fill="#E53935"/>' +
      '<ellipse cx="62" cy="58" rx="25" ry="30" fill="#E53935"/>' +
      '<ellipse cx="50" cy="64" rx="26" ry="26" fill="#E53935"/>' +
      '<ellipse cx="37" cy="50" rx="8" ry="13" fill="#FF8A80" opacity="0.5"/>' +
      '</svg>';
  }

  function ballSvg() {
    return '<svg viewBox="0 0 100 100" class="obj-svg" focusable="false">' +
      '<circle cx="50" cy="52" r="32" fill="#1E88E5"/>' +
      '<path d="M50 20 C68 28 74 40 74 52 C74 64 68 76 50 84 C32 76 26 64 26 52 C26 40 32 28 50 20 Z" fill="#1565C0" opacity="0.18"/>' +
      '<ellipse cx="40" cy="40" rx="10" ry="8" fill="#BBDEFB" opacity="0.85"/>' +
      '<path d="M22 48 Q50 38 78 48" fill="none" stroke="#FFF176" stroke-width="5" stroke-linecap="round"/>' +
      '</svg>';
  }

  function flowerSvg() {
    return '<svg viewBox="0 0 100 100" class="obj-svg" focusable="false">' +
      '<circle cx="50" cy="28" r="14" fill="#EC407A"/>' +
      '<circle cx="72" cy="42" r="14" fill="#EC407A"/>' +
      '<circle cx="65" cy="68" r="14" fill="#EC407A"/>' +

  }

  function balloonSvg() {
    return '<svg viewBox="0 0 100 100" class="obj-svg" focusable="false">' +
      '<ellipse cx="50" cy="40" rx="24" ry="28" fill="#7E57C2"/>' +
      '<ellipse cx="42" cy="30" rx="8" ry="10" fill="#B39DDB" opacity="0.75"/>' +

      '<path d="M50 76 Q42 86 50 96" fill="none" stroke="#6D4C41" stroke-width="2" stroke-linecap="round"/>' +
      '</svg>';
  }

  function pearSvg() {
    return '<svg viewBox="0 0 100 100" class="obj-svg" focusable="false">' +
      '<rect x="47" y="10" width="6" height="16" rx="3" fill="#6D4C41"/>' +
      '<ellipse cx="62" cy="22" rx="11" ry="6" fill="#7CB342" transform="rotate(25 62 22)"/>' +

      '<ellipse cx="40" cy="58" rx="7" ry="11" fill="#F0F4C3" opacity="0.55"/>' +
      '</svg>';
  }

  function objectSvg(kind) {
    if (kind === 'star') return starSvg('#FFD54F', '#F9A825');
    if (kind === 'ball') return ballSvg();
    if (kind === 'flower') return flowerSvg();
    if (kind === 'balloon') return balloonSvg();
    if (kind === 'pear') return pearSvg();
    return appleSvg();
  }

  function objectHtml(kind, crossed) {
    var cls = 'obj' + (crossed ? ' obj-gone' : '');

      html += '<svg class="obj-cross" viewBox="0 0 100 100" focusable="false">' +
        '<line x1="18" y1="18" x2="82" y2="82" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>' +

      '</g>' +
      '<circle cx="60" cy="60" r="32" fill="#FFE566" stroke="#F9A825" stroke-width="3"/>' +
      '<circle cx="50" cy="54" r="4" fill="#6D4C41"/>' +

      '<path d="M48 70 Q60 82 72 70" fill="none" stroke="#6D4C41" stroke-width="3" stroke-linecap="round"/>' +
      '</svg>';
  }

  function homeIconHtml() {
    return '<svg viewBox="0 0 30 30" width="30" height="30" focusable="false">' +

  }

      '</svg>';

  /* ---------- audio / speech ---------- */
  function ensureAudio() {
    var Ctx, ctx;
    if (state.audioCtx) {
      ctx = state.audioCtx;
      if (ctx.state === 'suspended' && ctx.resume) {
        try { ctx.resume(); } catch (e1) {}
      }
      return ctx;
    }
    Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    try {
      state.audioCtx = new Ctx();
      return state.audioCtx;
    } catch (e2) {
      return null;
    }
  }

  function playTone(freq, dur, type, gainVal, delay) {
    var ctx, osc, gain, now;
    if (!state.soundOn) return;
    ctx = ensureAudio();
    if (!ctx) return;
    try {
      osc = ctx.createOscillator();
      gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      now = ctx.currentTime + (delay || 0);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(gainVal || 0.12, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + dur + 0.05);
    } catch (e) {}
  }

  function playSuccess() {
    playTone(523.25, 0.13, 'sine', 0.11, 0);
    playTone(659.25, 0.13, 'sine', 0.11, 0.1);
    playTone(783.99, 0.28, 'sine', 0.13, 0.2);
  }

  function playWrong() {
    playTone(262, 0.16, 'sine', 0.06, 0);
    playTone(220, 0.2, 'sine', 0.05, 0.08);
  }

  function playReward() {
    playTone(523, 0.18, 'sine', 0.11, 0);
    playTone(659, 0.18, 'sine', 0.11, 0.12);
    playTone(784, 0.18, 'sine', 0.11, 0.24);
    playTone(1046, 0.32, 'sine', 0.13, 0.36);
  }

  function speak(text) {
    var u, voices, i, chosen;
    if (!state.soundOn) return;
    if (!text) return;
    try {
      if (!window.speechSynthesis || typeof window.SpeechSynthesisUtterance === 'undefined') {
        return;
      }
      window.speechSynthesis.cancel();
      u = new window.SpeechSynthesisUtterance(text);
      u.lang = 'nl-NL';
      u.rate = 0.9;
      u.pitch = 1.05;
      u.volume = 1;
      try {
        voices = window.speechSynthesis.getVoices();
        if (voices && voices.length) {
          chosen = null;
          for (i = 0; i < voices.length; i++) {
            if (voices[i].lang && voices[i].lang.toLowerCase().indexOf('nl') === 0) {
              chosen = voices[i];
              break;
            }
          }
          if (chosen) u.voice = chosen;
        }
      } catch (e1) {}
      window.speechSynthesis.speak(u);
    } catch (e2) {}
  }

  /* ---------- questions ---------- */
  function makeChoices(correct, minN, maxN) {
    var set = [correct];
    var guard = 0;
    var n, extra, down, up;
    while (set.length < 3 && guard < 40) {
      guard += 1;
      n = randInt(minN, maxN);
      if (!contains(set, n)) set.push(n);
    }
    extra = 0;
    while (set.length < 3) {
      extra += 1;
      down = correct - extra;
      up = correct + extra;
      if (down >= 0 && !contains(set, down)) set.push(down);
      if (set.length < 3 && !contains(set, up)) set.push(up);
    }
    return shuffle(set);
  }

  function makeCountQ() {
    var n, tries, kind, q;
    tries = 0;
    do {
      n = randInt(1, 10);
      tries += 1;
    } while (n === state.lastAnswer && tries < 8);
    kind = pick(KINDS);
    q = {
      mode: 'count',
      kind: kind,
      answer: n,
      prompt: 'Hoeveel?',
      speech: 'Hoeveel zijn het?',
      choices: makeChoices(n, 1, 10)
    };
    return q;
  }

  function makePlusQ(maxSum) {
    var a, b, sum, tries, kind, minSum, q;
    tries = 0;
    minSum = (maxSum <= 5) ? 2 : 5;
    do {
      sum = randInt(minSum, maxSum);
      a = randInt(1, sum - 1);
      b = sum - a;
      tries += 1;
    } while (sum === state.lastAnswer && tries < 8);
    kind = pick(KINDS);
    q = {
      mode: 'plus',
      kind: kind,
      a: a,
      b: b,
      answer: sum,
      prompt: 'Hoeveel?',
      speech: a + ' plus ' + b + '. Hoeveel is dat?',
      choices: makeChoices(sum, 1, maxSum)
    };
    return q;
  }

  function makeMinusQ(maxN) {
    var total, take, left, tries, kind, q;
    tries = 0;
    do {
      total = randInt(2, maxN);
      take = (total <= 2) ? 1 : randInt(1, total - 1);
      left = total - take;
      tries += 1;
    } while (left === state.lastAnswer && tries < 8);
    kind = pick(KINDS);
    q = {
      mode: 'minus',
      kind: kind,
      total: total,
      take: take,
      answer: left,
      prompt: 'Hoeveel blijven er?',
      speech: 'Er zijn ' + total + ', er gaan ' + take + ' weg. Hoeveel blijven er?',
      choices: makeChoices(left, 0, maxN)
    };
    return q;
  }

  function dutchNum(n) {
    var words = ['nul', 'één', 'twee', 'drie', 'vier', 'vijf', 'zes', 'zeven', 'acht', 'negen', 'tien'];
    if (n >= 0 && n <= 10) return words[n];
    return String(n);
  }

  function makeTableChoices(a, b) {
    var correct, raw, others, choices, i, n, extra, down, up;
    correct = a * b;
    raw = [
      a * (b + 1),
      a * (b - 1),
      (a + 1) * b,
      (a - 1) * b,
      correct + a,
      correct - a,
      correct + b,
      correct - b,
      a + b,
      a * a,
      b * b,
      correct + 1,
      correct - 1,
      (a + 1) * (b + 1)
    ];
    others = [];
    for (i = 0; i < raw.length; i++) {
      n = raw[i];
      if (n >= 1 && n <= 120 && n !== correct && !contains(others, n)) {
        others.push(n);
      }
    }
    shuffle(others);
    choices = [correct];
    if (others.length > 0) choices.push(others[0]);
    if (others.length > 1) choices.push(others[1]);
    extra = 1;
    while (choices.length < 3) {
      down = correct - extra;
      up = correct + extra;
      if (down >= 1 && !contains(choices, down)) choices.push(down);
      if (choices.length < 3 && !contains(choices, up)) choices.push(up);
      extra += 1;
    }
    return shuffle(choices);
  }

  function makeTableQ() {
    var a, b, product, tries, q;
    tries = 0;
    do {
      if (state.tableN === 0) {
        a = randInt(1, 10);
        b = randInt(1, 10);
      } else {
        a = state.tableN;
        b = randInt(1, 10);
      }
      product = a * b;
      tries += 1;
    } while (a === state.lastA && b === state.lastB && tries < 8);
    q = {
      mode: 'tables',
      a: a,
      b: b,
      answer: product,
      prompt: a + ' × ' + b + ' = ?',
      speech: dutchNum(a) + ' keer ' + dutchNum(b),
      choices: makeTableChoices(a, b),
      showVisual: product <= 30
    };
    return q;
  }

  function visualTableHtml(rows, cols) {
    var r, c, html, sizeCls, n;
    n = rows * cols;
    sizeCls = (n >= 20) ? 'dots-sm' : (n >= 12 ? 'dots-md' : 'dots-lg');
    html = '<div class="tray vis-table ' + sizeCls + '">';
    for (r = 0; r < rows; r++) {
      html += '<div class="trow">';
      for (c = 0; c < cols; c++) {
        html += '<span class="tdot"></span>';
      }
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function nextQuestion() {
    var q, maxN;
    state.locked = false;
    hideToast();
    hideBurst();
    if (state.level === 'count') q = makeCountQ();
    else if (state.level === 'plus5') q = makePlusQ(5);
    else if (state.level === 'plus10') q = makePlusQ(10);
    else if (state.level === 'tables') q = makeTableQ();
    else {
      if (state.sessionCorrect >= 5) state.minusHard = true;
      maxN = state.minusHard ? 10 : 5;
      q = makeMinusQ(maxN);
    }
    state.question = q;
    if (q.mode === 'tables') {
      state.lastA = q.a;
      state.lastB = q.b;
    }
    renderQuestion(q);
  }

  function renderQuestion(q) {
    var box, html, i, buttons, btn, val, n, sizeCls;
    $('prompt').innerHTML = q.prompt;
    box = $('objects');
    html = '';
    if (q.mode === 'tables') {
      $('prompt').className = q.showVisual ? 'prompt' : 'prompt prompt-xl';
      box.innerHTML = q.showVisual ? visualTableHtml(q.a, q.b) : '';
      buttons = $('answers').getElementsByTagName('button');
      for (i = 0; i < 3; i++) {
        btn = buttons[i];
        val = q.choices[i];
        btn.innerHTML = String(val);
        btn.setAttribute('data-value', String(val));
        btn.setAttribute('data-act', 'answer');
        if (val === q.answer) btn.setAttribute('data-ok', '1');
        else btn.removeAttribute('data-ok');
        btn.className = 'tap answer-btn';
      }
      updateStarsUI();
      speak(q.speech);
      return;
    }
    $('prompt').className = 'prompt';
    if (q.mode === 'count') {
      html = '<div class="group">';
      for (i = 0; i < q.answer; i++) html += objectHtml(q.kind, false);
      html += '</div>';
    } else if (q.mode === 'plus') {
      html = '<div class="group group-eq">';
      for (i = 0; i < q.a; i++) html += objectHtml(q.kind, false);
      html += '</div>';
      html += plusSignHtml();
      html += '<div class="group group-eq">';
      for (i = 0; i < q.b; i++) html += objectHtml(q.kind, false);
      html += '</div>';
    } else {
      html = '<div class="group">';
      for (i = 0; i < q.total; i++) {
        html += objectHtml(q.kind, i >= (q.total - q.take));
      }
      html += '</div>';
    }
    n = (q.mode === 'count') ? q.answer : (q.mode === 'plus' ? (q.a + q.b) : q.total);
    sizeCls = (n <= 4) ? 'size-lg' : (n <= 7 ? 'size-md' : 'size-sm');
    box.innerHTML = '<div class="tray ' + sizeCls + '">' + html + '</div>';

    buttons = $('answers').getElementsByTagName('button');
    for (i = 0; i < 3; i++) {
      btn = buttons[i];
      val = q.choices[i];
      btn.innerHTML = String(val);
      btn.setAttribute('data-value', String(val));
      btn.setAttribute('data-act', 'answer');
      if (val === q.answer) btn.setAttribute('data-ok', '1');
      else btn.removeAttribute('data-ok');
      btn.className = 'tap answer-btn';
    }
    updateStarsUI();
    speak(q.speech);
  }

  /* ---------- UI ---------- */
  function updateStarsUI() {
    var i, row, html, filled, el;
    if ($('home-stars')) $('home-stars').innerHTML = String(state.stars);
    if ($('play-stars')) $('play-stars').innerHTML = String(state.stars);
    if ($('picker-stars')) $('picker-stars').innerHTML = String(state.stars);
    row = $('progress-row');
    if (row) {
      filled = state.towardsReward;
      if (filled > 5) filled = 5;
      html = '';
      for (i = 0; i < 5; i++) {
        html += '<span class="prog-star' + (i < filled ? ' on' : '') + '">' +
          starSvg(i < filled ? '#FFD54F' : '#FFFFFF', i < filled ? '#F9A825' : '#CFC8B8') +
          '</span>';
      }
      row.innerHTML = html;
    }
    updateSoundIcons();
  }

  function updateSoundIcons() {
    var html = state.soundOn ? soundOnHtml() : soundOffHtml();
    elSet('sound-icon', html);
    elSet('sound-icon-play', html);
    elSet('sound-icon-picker', html);
  }

  function elSet(id, html) {
    var el = $(id);
    if (el) el.innerHTML = html;
  }

  function showScreen(name) {
    state.screen = name;
    $('screen-home').className = (name === 'home') ? '' : 'is-hidden';
    $('screen-picker').className = (name === 'picker') ? '' : 'is-hidden';
    $('screen-play').className = (name === 'play') ? '' : 'is-hidden';
    hideReward();
    hideToast();
    hideBurst();

  function showToast(text, good) {
    var el = $('toast');
    el.innerHTML = text;
    el.className = 'is-hidden';
    el.offsetWidth;
    el.className = good ? 'good' : '';
    if (toastTimer) window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function () {
      hideToast();
    }, 1200);
  }

  function hideToast() {
    $('toast').className = 'is-hidden';
    if (toastTimer) {
      window.clearTimeout(toastTimer);
      toastTimer = null;
    }

  function showBurst() {
    var el = $('burst');
    el.innerHTML = starSvg('#FFD54F', '#F9A825');

    if (burstTimer) window.clearTimeout(burstTimer);
    burstTimer = window.setTimeout(function () {
      hideBurst();
    }, 900);
  }

  function hideBurst() {
    $('burst').className = 'is-hidden';
    if (burstTimer) {
      window.clearTimeout(burstTimer);
      burstTimer = null;
    }
  }

  function showReward() {
    var i, html;
    html = '';
    for (i = 0; i < 3; i++) {
      html += '<span class="rs">' + starSvg('#FFD54F', '#F9A825') + '</span>';
    }
    $('reward-stars').innerHTML = html;
    $('reward-text').innerHTML = pick(REWARD);

    playReward();
    speak($('reward-text').innerHTML);

  function hideReward() {
    $('overlay-reward').className = 'overlay is-hidden';
  }

  function goHome() {
    state.level = null;
    state.locked = false;
    state.question = null;
    hideReward();
    showScreen('home');
    updateStarsUI();
  }

  function showPicker() {
    state.level = 'tables';
    state.locked = false;
    state.question = null;
    hideReward();
    showScreen('picker');
    updateStarsUI();
  }

  function startLevel(level) {
    state.level = level;
    state.sessionCorrect = 0;
    state.towardsReward = 0;
    state.locked = false;
    state.lastAnswer = -1;
    state.lastA = -1;
    state.lastB = -1;
    state.minusHard = false;
    showScreen('play');
    nextQuestion();
  }

  function onAnswer(btn) {
    var val, correct;
    if (state.locked) return;
    if (!state.question) return;
    val = parseInt(btn.getAttribute('data-value'), 10);
    correct = state.question.answer;
    if (val === correct) {
      state.locked = true;
      state.stars += 1;
      state.sessionCorrect += 1;
      state.towardsReward += 1;
      state.lastAnswer = correct;
      saveStars();
      btn.className = 'tap answer-btn is-correct';
      playSuccess();
      showBurst();
      showToast(pick(PRAISE), true);
      speak(btn ? pick(PRAISE) : 'Goed zo!');
      updateStarsUI();
      window.setTimeout(function () {
        if (state.towardsReward >= 5) {
          showReward();
        } else {
          nextQuestion();
        }
      }, 1100);
    } else {
      playWrong();
      btn.className = 'tap answer-btn is-wrong shake';
      showToast('Probeer nog eens', false);
      speak('Probeer nog eens');
      window.setTimeout(function () {
        if (btn && btn.className.indexOf('is-correct') === -1) {
          btn.className = 'tap answer-btn is-wrong';
        }
      }, 450);
    }
  }

  function toggleSound() {
    state.soundOn = !state.soundOn;
    saveSound();
    updateSoundIcons();
    if (state.soundOn) {
      ensureAudio();
      playSuccess();
    } else if (window.speechSynthesis) {
      try { window.speechSynthesis.cancel(); } catch (e) {}
    }
  }

  /* ---------- tap handling (iOS 9, no 300ms delay) ---------- */
  function findClickable(el) {
    while (el && el !== document.body && el !== document.documentElement) {
      if (el.getAttribute && el.getAttribute('data-act') &&
          el.className && (' ' + el.className + ' ').indexOf(' tap ') !== -1) {
        return el;
      }
      el = el.parentNode;
    }
    return null;
  }

  function clearPressed() {
    if (pressEl) {
      pressEl.className = pressEl.className.replace(/\s?pressed/g, '');
      pressEl = null;
    }
  }

  function setPressed(el) {
    clearPressed();
    if (!el) return;
    pressEl = el;
    if ((' ' + el.className + ' ').indexOf(' pressed ') === -1) {
      el.className = el.className + ' pressed';
    }
  }

  function handleAct(el) {
    var act, level, t;
    act = el.getAttribute('data-act');
    if (act === 'sound') {
      toggleSound();
      return;
    }
    if (act === 'home') {
      if (state.screen === 'play' && state.level === 'tables') {
        showPicker();
      } else {
        goHome();
      }
      return;
    }
    if (act === 'verder') {
      hideReward();
      state.towardsReward = 0;
      updateStarsUI();
      nextQuestion();
      return;
    }
    if (act === 'level') {
      level = el.getAttribute('data-level');
      if (level === 'tables') {
        showPicker();
        return;
      }
      if (level) startLevel(level);
      return;
    }
    if (act === 'table') {
      t = parseInt(el.getAttribute('data-table'), 10);
      if (isNaN(t)) return;
      state.tableN = t;
      startLevel('tables');
      return;
    }
    if (act === 'answer') {
      onAnswer(el);
    }
  }

  function onTouchStart(e) {
    var t, el;
    if (!e.touches || e.touches.length !== 1) return;
    t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    touchStartTime = new Date().getTime();
    touchMoved = false;
    el = findClickable(e.target);
    if (el) setPressed(el);
  }

  function onTouchMove(e) {
    var t;
    if (!e.touches || e.touches.length < 1) return;
    t = e.touches[0];
    if (Math.abs(t.clientX - touchStartX) > 16 || Math.abs(t.clientY - touchStartY) > 16) {
      touchMoved = true;
      clearPressed();
    }
    e.preventDefault();
  }

  function onTouchEnd(e) {
    var el, now;
    now = new Date().getTime();
    el = findClickable(e.target);
    clearPressed();
    if (!touchMoved && el && (now - touchStartTime) < 700) {
      e.preventDefault();
      lastTouchEnd = now;
      handleAct(el);
    }
  }

  function onTouchCancel() {
    touchMoved = true;
    clearPressed();
  }

  function onClick(e) {
    var el, now;
    now = new Date().getTime();
    if (now - lastTouchEnd < 600) {
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    el = findClickable(e.target);
    if (el) {
      handleAct(el);
    }
  }

  function onGestureStart(e) {
    e.preventDefault();
  }

  function ready() {
    loadState();
    decorateStatic();
    updateStarsUI();
    showScreen('home');

    document.addEventListener('touchstart', onTouchStart, false);
    document.addEventListener('touchmove', onTouchMove, false);
    document.addEventListener('touchend', onTouchEnd, false);
    document.addEventListener('touchcancel', onTouchCancel, false);
    document.addEventListener('click', onClick, false);

    window.addEventListener('orientationchange', function () {
      window.scrollTo(0, 0);
      window.setTimeout(function () { window.scrollTo(0, 0); }, 250);

    }, false);
  }

  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    ready();
  } else {
    document.addEventListener('DOMContentLoaded', ready, false);
  }
})();
